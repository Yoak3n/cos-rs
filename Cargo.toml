[package]
name = "cos"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "cos CLI 宿主（插件化主干，A 形态）"

[dependencies]
cos-agent = { path = "crates/cos-agent", version = "0.1.0" }
cos-agent-loop = { path = "crates/cos-agent-loop", version = "0.1.0" }
cos-contract = { path = "crates/cos-contract", version = "0.1.0" }
cos-core = { path = "crates/cos-core", version = "0.1.0" }
cos-invariants = { path = "crates/cos-invariants", version = "0.1.0" }
cos-llm = { path = "crates/cos-llm", version = "0.1.0" }
cos-loader = { path = "crates/cos-loader", version = "0.1.0" }
cos-memory = { path = "crates/cos-memory", version = "0.1.0" }
cos-rpc = { path = "crates/cos-rpc", version = "0.1.0" }
cos-session = { path = "crates/cos-session", version = "0.1.0" }
cos-shell = { path = "crates/cos-shell", version = "0.1.0" }
cos-system-prompt = { path = "crates/cos-system-prompt", version = "0.1.0" }
cos-tools = { path = "crates/cos-tools", version = "0.1.0" }
plugin-bash = { path = "plugins/plugin-bash", version = "0.1.0", optional = true }
plugin-custom-provider = { path = "plugins/plugin-custom-provider", version = "0.1.0", optional = true }
plugin-deepseek-provider = { path = "plugins/plugin-deepseek-provider", version = "0.1.0", optional = true }
plugin-llm = { path = "plugins/plugin-llm", version = "0.1.0", optional = true }
plugin-memory = { path = "plugins/plugin-memory", version = "0.1.0", optional = true }
plugin-opencode-provider = { path = "plugins/plugin-opencode-provider", version = "0.1.0", optional = true }
plugin-rpc = { path = "plugins/plugin-rpc", version = "0.1.0", optional = true }
plugin-todo = { path = "plugins/plugin-todo", version = "0.1.0", optional = true }
futures.workspace = true
inventory.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
cos-test-support = { path = "crates/cos-test-support", version = "0.1.0" }

# 二进制入口在 src/bin/main.rs；显式命名 `cos`（否则 target 名 = main，
# CARGO_BIN_EXE_cos / cargo install cos 都会失效）
[[bin]]
name = "cos"
path = "src/bin/main.rs"

[features]
# 默认 = 全插件（CLI 形态）。库嵌入可 `default-features = false` 只取框架核心，
# 再按需启用单个插件 feature（如 features = ["plugin-memory"]）。
default = ["full"]
full = [
    "plugin-bash",
    "plugin-custom-provider",
    "plugin-deepseek-provider",
    "plugin-llm",
    "plugin-memory",
    "plugin-opencode-provider",
    "plugin-rpc",
    "plugin-todo",
]
plugin-bash = ["dep:plugin-bash"]
plugin-custom-provider = ["dep:plugin-custom-provider"]
plugin-deepseek-provider = ["dep:plugin-deepseek-provider"]
plugin-llm = ["dep:plugin-llm"]
plugin-memory = ["dep:plugin-memory"]
plugin-opencode-provider = ["dep:plugin-opencode-provider"]
plugin-rpc = ["dep:plugin-rpc"]
plugin-todo = ["dep:plugin-todo"]
# 库嵌入按需：内置协议适配器（openai / anthropic / responses；带 reqwest 网络栈）
llm-adapters = ["cos-llm/adapters"]

[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cordis.yml 解析（cos-loader）：纯 Rust、零 unsafe 的 YAML 实现。
# 换掉 serde_yaml（已 deprecated，其 libyaml 翻译层 unsafe-libyaml 上游归档无人维护，
# RustSec RUSTSEC-2024-0449）；只需要反序列化，serialize/comments 特性不开。
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "io-std", "io-util"] }
inventory = "0.3"
